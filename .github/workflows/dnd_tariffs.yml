name: D&D Tariff Monthly Refresh

# Save this file as .github/workflows/dnd_tariffs.yml in the repo.
#
# Runs once a month, in the same style as terminal-extractor's scheduled
# workflow: install deps, run the script, done. The difference here is that
# the script (run_monthly.py) reads AND writes a single fixed Google Drive
# file in place each run - it downloads the current master workbook,
# upserts newly scraped rows into it (appending new ones, refreshing only
# the Contract end date on ones that already exist, skipping anything
# marked "Manually Reviewed"), then re-uploads and verifies the round trip.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions),
# same pattern as terminal_slot_scraper.py's GDRIVE_* secrets:
#   GDRIVE_FILE_ID          - Drive file ID of the master workbook itself
#                             (not a folder - this overwrites that one file)
#   GDRIVE_CREDENTIALS_JSON - service account credentials JSON, shared with
#                             (or copied from) the terminal-extractor's
#                             GDRIVE_CREDENTIALS_JSON secret if it's the
#                             same service account / Drive
#
# The service account needs Editor access on that specific Drive file
# (share the file with the service account's email, same as any other
# Drive-API automation).
#
# Uses a real headless browser (Playwright/Chromium) to fetch carrier pages
# instead of plain HTTP requests - a bare requests.get() call gets 403'd
# from GitHub Actions' IPs. Confirmed that gets Maersk through fine.
#
# CMA CGM (and, still unresolved, Hapag-Lloyd and MSC) sit behind Cloudflare/
# WAF bot protection that specifically blocks GitHub Actions' hosted-runner
# IP ranges (a "Just a moment..." JS challenge or a hard "Access Denied",
# confirmed on both a raw request and a full headless-browser page render) -
# no client-side fetch trick fixes that, and deliberately engineering one
# would just be bypassing the site's bot-detection, which isn't something to
# build regardless of feasibility.
#
# Fix: this job runs on a SELF-HOSTED runner (a BuyCo laptop) instead of
# GitHub's hosted ubuntu-latest runners. That's a legitimately different
# thing, not a workaround - it's the same request a normal employee's
# browser would make, from a normal (non-datacenter, non-scraper-flagged)
# network, same as manually visiting the site would be. See "Self-hosted
# runner setup" below for how to register the laptop.
#
# CMA CGM still has a manual-drop Drive folder as a fallback (not the only
# path anymore) - if live discovery ever comes back empty (e.g. the laptop
# was offline when the schedule fired and this run went to a hosted runner,
# or CMA CGM's protection changes again), the run reads whatever's in that
# folder instead of producing nothing for that carrier that month.
#   CMA_CGM_MANUAL_FOLDER_ID - Drive folder ID for that drop folder
#                             (optional - if unset and live discovery finds
#                             nothing, CMA CGM is just skipped for the run
#                             with a clear message). The service account
#                             needs at least Viewer access on this folder.
#
# --- Self-hosted runner setup (one-time, on the BuyCo laptop) ---
#   1. Repo -> Settings -> Actions -> Runners -> "New self-hosted runner".
#   2. Pick macOS, and run the commands GitHub shows you in a Terminal on
#      the laptop (downloads the runner, then `./config.sh --url ... --token ...`
#      using the URL/token GitHub generates for you there).
#   3. Install it as a background service so it's always listening, not
#      just while a Terminal window happens to be open:
#        sudo ./svc.sh install
#        sudo ./svc.sh start
#   4. That's it - once registered, this workflow (runs-on: self-hosted)
#      will dispatch to that laptop automatically, both for the monthly
#      schedule and for manual "Run workflow" triggers.
#   Caveat: the laptop needs to be powered on and online for the monthly
#   cron trigger to actually run - if it's asleep/off at 06:00 UTC on the
#   1st, that scheduled run simply won't fire on it. workflow_dispatch
#   (manual trigger) always works whenever the laptop's runner is online,
#   so a quick manual run is the catch-up path for a missed month.

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  refresh:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        # No --with-deps here (that flag installs Linux system packages via
        # apt-get and fails/is irrelevant on macOS) - just the browser binary.
        run: playwright install chromium

      - name: Run monthly refresh
        env:
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          CMA_CGM_MANUAL_FOLDER_ID: ${{ secrets.CMA_CGM_MANUAL_FOLDER_ID }}
        run: python3 run_monthly.py

      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-tariff-run-output
          path: output/
          retention-days: 14
